<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Love - Đồ Uống & Bánh Ngọt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <a href="#">Trang chủ</a>
            <a href="#">Bánh Ngọt</a>
            <a href="#">Bánh Kem</a>
            <a href="#">Bánh Bao</a>
            <a href="#">Liên hệ</a>
        </nav>
        <div class="search-box">
            <input type="text" placeholder="Tìm kiếm...">
            <button type="button">Tìm kiếm</button>
        </div>
    </header>

    <div class="logo-container">
        <div class="logo-badge">Water love</div>
    </div>


    <section class="banner">
        <img src="image/banner.jpg" alt="">
    </section>

    <main>
        <h2 class="section-title">Ưu Đãi Dành Riêng Cho Bạn</h2>
        
        <div class="product-grid">
    
            <article class="product-card">
                <img src="image/anh_1.png" alt="">
                <div class="product-name">Freeze Trà Xanh</div>
                <div>
                    <span class="price-current">25.000đ</span>
                    <span class="price-old">35.000đ</span>
                </div>
            </article>

            <article class="product-card">
                <img src="image/anh_2.png" alt="">
                <div class="product-name">Cà phê phin Highlands</div>
                <div>
                    <span class="price-current">29.000đ</span>
                    <span class="price-old">37.000đ</span>
                </div>
            </article>

            <article class="product-card">
                <img src="image/anh_3.png" alt="">
                <div class="product-name">Trà Thạch Vải</div>
                <div>
                    <span class="price-current">25.000đ</span>
                    <span class="price-old">35.000đ</span>
                </div>
            </article>

            <article class="product-card">
                <img src="image/anh_4.png" alt="">
                <div class="product-name">Trà Thạch Đào</div>
                <div>
                    <span class="price-current">25.000đ</span>
                    <span class="price-old">35.000đ</span>
                </div>
            </article>
        </div>
    </main>

    <footer>
        <p>Copyright © 2026 Design by Ochna</p>
    </footer>

</body>
</html>
